<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Berlin Flat Finder</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">kişisel arama</p>
      <h1>Berlin Flat Finder</h1>
    </div>
    <p class="lede">WG-Gesucht, Kleinanzeigen ve ImmoScout. Yeni ilan gelince Telegram.</p>
  </header>

  <main>
    <section class="card" id="filters">
      <h2>Filtre</h2>

      <label>Mahalle</label>
      <div id="districts" class="chips"></div>

      <div class="grid">
        <label>Max kira (warm)
          <input id="max_rent" type="number" min="200" max="8000" step="50" />
        </label>
        <label>Min oda
          <input id="min_rooms" type="number" min="1" max="8" step="0.5" />
        </label>
        <label>Min m²
          <input id="min_sqm" type="number" min="0" max="200" step="5" />
        </label>
      </div>

      <div class="grid">
        <label>Başlangıç (boş = fark etmez)
          <input id="start_from" type="date" />
        </label>
        <label>En az ay (0 = fark etmez)
          <input id="min_months" type="number" min="0" max="36" step="1" />
        </label>
        <label>En fazla ay (0 = fark etmez)
          <input id="max_months" type="number" min="0" max="36" step="1" />
        </label>
      </div>

      <label>Tip</label>
      <div class="chips">
        <button type="button" class="chip type" data-type="wg">WG odası</button>
        <button type="button" class="chip type" data-type="apartment">Daire</button>
        <button type="button" class="chip type" data-type="sublet">Zwischenmiete</button>
      </div>

      <label>Kaynak</label>
      <div class="chips">
        <button type="button" class="chip source" data-source="wg_gesucht">WG-Gesucht</button>
        <button type="button" class="chip source" data-source="kleinanzeigen">Kleinanzeigen</button>
        <button type="button" class="chip source" data-source="immoscout">ImmoScout24</button>
      </div>

      <label>Tarama aralığı</label>
      <div class="chips">
        <button type="button" class="chip interval" data-hours="12">12 saat</button>
        <button type="button" class="chip interval" data-hours="24">24 saat</button>
      </div>

      <label>Telegram chat ID
        <input id="telegram_chat_id" type="text" placeholder="Bota /start yazınca otomatik dolar" />
      </label>
      <p class="hint" id="bot-hint"></p>

      <div class="actions">
        <button type="button" id="save">Kaydet</button>
        <button type="button" id="scan" class="ghost">Şimdi tara</button>
      </div>
      <p class="status" id="status"></p>
    </section>

    <section class="card">
      <div class="row">
        <h2>İlanlar</h2>
        <p class="hint" id="scan-meta">Henüz tarama yok.</p>
      </div>
      <div id="listings" class="listings"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
